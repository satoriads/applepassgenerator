name: Build

on:
  push:
    branches: [ main, changemessage ]
  pull_request:
    branches: [ main, changemessage ]

jobs:
  build:
    name: Build Python Package
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        cryptography-version: ["42.0.0", "44.0.0", "46.0.7", "latest"]
        os: [ubuntu-latest]
        include:
          # Spot-check macOS only on the newest combo to keep matrix small
          - python-version: "3.13"
            cryptography-version: "latest"
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install Poetry
      run: |
        python -m pip install --upgrade pip
        python -m pip install poetry
    - name: Install dependencies
      run: poetry install
    - name: Force cryptography ${{ matrix.cryptography-version }}
      if: matrix.cryptography-version != 'latest'
      run: poetry run pip install "cryptography==${{ matrix.cryptography-version }}"
    - name: Force latest cryptography
      if: matrix.cryptography-version == 'latest'
      run: poetry run pip install --upgrade cryptography
    - name: Print resolved versions
      run: |
        poetry run python -c "import cryptography, endesive; print('cryptography', cryptography.__version__); print('endesive', endesive.__version__)"
    - name: Run tests
      run: poetry run pytest --cov=./ --cov-report=xml
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        poetry run flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        poetry run flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
